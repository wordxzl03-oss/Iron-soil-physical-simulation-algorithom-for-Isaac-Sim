[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-loader-rl"
version = "0.1.0"
description = "Reusable RL environment and SAC baseline for wheel-loader excavation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "gymnasium>=1.3,<2",
  "stable-baselines3>=2.9,<3",
  "matplotlib>=3.7",
  "pillow>=10",
  "imageio-ffmpeg>=0.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "tensorboard>=2.20",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["wheel_loader_rl*", "isaac_bulk_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["review_bundle_*", "isaac_loader"]
