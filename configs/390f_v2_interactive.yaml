schema: 390f-v2-interactive/v1

runtime:
  headless: false
  wait_for_user: true
  initial_state: READY
  fail_policy: PAUSE_AND_REPORT

scene:
  vehicle_asset: /home/eric/桌面/bulldozer_sim/bulldozer_main.usd
  articulation_root: /World/Excavator/_90F_LME_ISAAC_DETAIL_DELIVERY/tn__390F_LME_ISAAC_DETAIL_DELIVERY_/tn__aaa0ab9
  bucket_link: /World/Excavator/_90F_LME_ISAAC_DETAIL_DELIVERY/tn__390F_LME_ISAAC_DETAIL_DELIVERY_/tn__aaa0ab9/tn__390F_DETAIL_DELIVERY_Bucket1_zf0
  lower_body: /World/Excavator/_90F_LME_ISAAC_DETAIL_DELIVERY/tn__390F_LME_ISAAC_DETAIL_DELIVERY_/tn__aaa0ab9/tn__390F_DETAIL_DELIVERY_Lower_Body1_xl0
  left_track_body: /World/Excavator/_90F_LME_ISAAC_DETAIL_DELIVERY/tn__390F_LME_ISAAC_DETAIL_DELIVERY_/tn__aaa0ab9/tn__390F_DETAIL_DELIVERY_Track_Left1_xl0
  right_track_body: /World/Excavator/_90F_LME_ISAAC_DETAIL_DELIVERY/tn__390F_LME_ISAAC_DETAIL_DELIVERY_/tn__aaa0ab9/tn__390F_DETAIL_DELIVERY_Track_Right1_hn0
  world_anchor_joint: /World/Excavator/_90F_LME_ISAAC_DETAIL_DELIVERY/tn__390F_LME_ISAAC_DETAIL_DELIVERY_/tn__aaa0ab9/Joints/lower_world_fixed
  mobile_base_enabled: true
  auto_align_track_bottom_to_ground: true
  track_ground_clearance_m: 0.02
  bucket_descriptor: configs/excavator_390f_real_bucket.yaml
  lighting_preset: outdoor_day

terrain:
  initial_heightmap: continuous_heightmap_25m_closed_dataset/sequence_000_H0_track_pile_acceptance_m.csv
  grid_shape_yx: [701, 701]
  grid_spacing_m: 0.05
  terrain_translation_world_m: [-0.25, -17.5, 0.0]
  visual_chunk_size: 64
  contact_chunk_size: 64
  contact_update_policy: DIRTY_EVENT
  # Static triangle-mesh recooking is event/low-frequency by design. The
  # authoritative 0.05 m TerrainState still advances every soil step.
  contact_update_hz: 0.5

material:
  scenario_file: configs/literature/iron_ore_condition_scenarios.json
  scenario_id: MOHAJERI_I3_AS_RECEIVED_LOW_STRESS_NEAR_MATCHED

physics:
  physics_dt_s: 0.016666666666666666
  solver_backend: OPTIMIZED
  active_tile_size: 64
  mobile_backend: OPTIMIZED_ACTIVE_CPU
  slope_backend: CPU_OPTIMIZED_COMPACT_TILE_FRONTIER
  large_avalanche_iteration_threshold: 1000
  numerical_safety_max_iterations: 1000000
  # MiniSlope is now a local/final residual operator. One compact frontier
  # round is committed per Isaac physics step; it never blocks phase ending.
  minislope_round_budget_per_step: 1
  # Explicit numerical stopping tolerance for final static relaxation.  This
  # is 4% of one 0.05 m cell and matches the existing 25 m/390F project
  # configuration. It does not change grid resolution or volume conservation.
  minislope_tolerance_m: 0.002
  # The production operator chain is now device-authoritative end to end.
  # HOST_REFERENCE remains available only as an explicit comparison backend;
  # the real interactive launcher defaults to the completed GPU runtime.
  runtime_backend: GPU_RUNTIME
  soil_force_mode: FULL_SOIL_FORCE
  track_soil_enabled: true
  preserve_full_resolution: true
  enforce_mass_balance_tolerance_m3: 1.0e-8

# Physical Resting -> Mobile transition for a connected sustained avalanche.
# These are explicit literature-based reduced-order engineering assumptions;
# they are not calibrated to the user's iron ore pile.  The material JSON
# carries the companion start/stop/friction sensitivity envelope.
large_avalanche_transition:
  minimum_connected_cells: 32
  minimum_connected_area_m2: 0.08
  minimum_mobilizable_volume_m3: 0.004
  minimum_mean_excess_start_deg: 0.0
  persistence_time_s: 0.12
  mobilization_depth_m: 0.08
  gravity_velocity_length_m: 0.25
  velocity_efficiency: 0.45
  mobile_activity_speed_m_s: 0.05
  mobile_activity_volume_m3: 1.0e-5
  dry_tolerance_m: 1.0e-8
  settled_mobile_volume_m3: 1.0e-5
  settled_speed_m_s: 0.05
  connectivity: 8
  parameter_basis: LITERATURE_BASED_REDUCED_ORDER_UNCALIBRATED
  sensitivity_case: nominal_uncalibrated

track_soil:
  # Length/width come from the real 390F CAD bounds audited in
  # outputs/390f_v2/390f_kinematic_geometry_audit.json.
  footprint_length_m: 6.17
  footprint_width_m: 0.80
  nominal_belt_speed_m_s: 1.20
  contact_gap_m: 0.08
  sinkage_rate_m_s: 0.012
  slip_gain: 0.8
  maximum_sinkage_per_step_m: 0.004
  maximum_total_rut_depth_m: 0.30
  shoulder_halo_cells: 3
  minimum_slip_speed_m_s: 0.02
  parameter_status: ENGINEERING_REDUCED_ORDER_NOT_SITE_CALIBRATED
  mechanics_status: CONSERVATIVE_REDUCED_ORDER_PENDING_Bekker_Wong_CALIBRATION

operation:
  # Production P0 trajectory: continuous, actuator-limited A-E curl-scoop.
  # This changes only arm target scheduling; all soil physics/task gates stay
  # authoritative and unchanged.
  realistic_cut_scoop_enabled: true
  cycle_count: 3
  dig_position_terrain_m: [5.5, 17.5, 1.8]
  dump_position_terrain_m: [14.0, 25.0, 1.0]
  phase_timeout_s: 12.0
  # This is a navigation failure envelope, not an avalanche cutoff. Once the
  # machine has stopped at the dig pose, terrain settling remains physically
  # gated and may continue beyond this value without truncation.
  return_travel_timeout_s: 60.0
  # Pivot in place when the point-target bearing is outside this forward
  # cone. This avoids the former reverse/forward pursuit loop while retaining
  # real differential-track force actuation and zero root-pose writes.
  navigation_drive_heading_gate_deg: 35.0
  phase_steps: 18
  phase_targets_deg:
    # Rebuilt from the real USD joint-axis/workspace audit.  The former labels
    # had boom/stick/bucket signs reversed ("initial" was 2.61 m underground).
    initial_pose: [0.0, -15.0, 45.0, -100.0]
    approach_pile: [0.0, -15.0, 35.333333, -80.0]
    penetrate: [0.0, -10.0, 16.0, -60.0]
    coordinated_cut: [0.0, -10.0, 6.333333, -60.0]
    # The CAD-derived retention check establishes the bucket-joint polarity:
    # positive curl retains material, while the negative limit opens the mouth
    # downward.  The earlier sequence had carry and dump polarities reversed.
    curl_filling: [0.0, -15.0, 25.666667, 30.0]
    # CAD self-collision/linkage closure makes the old simultaneous
    # stick=45/bucket=60 command unreachable.  These observed reachable poses
    # retain the full 5.63 m3 geometry while preserving transport clearance.
    breakout: [0.0, -25.0, 24.0, 42.0]
    lift: [0.0, -25.0, 17.5, 56.0]
    # 15 degrees keeps the complete CAD mouth footprint inside the 701x701
    # heightmap after the required 2 m reverse.  At 65 degrees four of five
    # measured dump parcels started beyond the left terrain boundary.
    upper_body_swing: [15.0, -25.0, 17.5, 56.0]
    dump_spill: [15.0, -25.0, -13.0, -115.0]
    deposition: [15.0, -25.0, -13.0, -115.0]
    swing_back: [0.0, -15.0, 45.0, -100.0]
    next_dig_ready: [0.0, -15.0, 45.0, -100.0]

controller:
  shared_positive_power_limit_w: 391000.0
  target_velocity_800_removed: true
  teleport_allowed: false
  kinematic_debug_increment_deg: 1.0
  maximum_tractive_force_per_track_n: 450000.0
  maximum_braking_force_per_track_n: 220000.0
  track_force_provenance: UNCALIBRATED_PARAMETER_REDUCED_ORDER_TRACK_FORCE_ACTUATOR

visualization:
  debug_overlay_enabled: true
  status_panel_enabled: true
  render_interval_sim_s: 0.1
  record_video: false
  width: 1280
  height: 720

logging:
  enabled: true
  buffer_frames: 4096
  flush_at_cycle_end: true
  formats: [npz, csv, json]

output:
  root: outputs/390f_v2/interactive_runs
