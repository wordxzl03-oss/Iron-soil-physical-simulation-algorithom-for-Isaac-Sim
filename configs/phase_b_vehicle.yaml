schema_version: isaac-bulk-phase-b-vehicle/v1
phase: B
purpose: manual_flat_ground_vehicle

vehicle:
  provenance:
    wheel_radius_m: KNOWN_GEOMETRY
    dof_names: KNOWN_GEOMETRY
    wheel_directions: KNOWN_GEOMETRY
    wheel_velocity_rad_s: UNCALIBRATED
    wheel_effort_nm: UNCALIBRATED
    wheel_power_limit_w: UNCALIBRATED
    wheel_power_reference_rad_s: NUMERICAL
    wheel_power_min_guard_rad_s: UNCALIBRATED_GUARD
    wheel_power_discrete_safety_factor: UNCALIBRATED_DISCRETE_GUARD
    position_limits: CONSERVATIVE_WITHIN_USD
    command_slew_rates: ASSUMED
  dof_names:
    wheels:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    steering: articulation_joint
    lift: lift_joint
    bucket_curl: bucket_joint
  # The audited asset authors all four revolute axes as +Y without mirrored
  # child frames. Replacement assets may override these signs.
  wheel_directions: [1, 1, 1, 1]
  wheel_radius_m: 0.78
  limits:
    wheel_velocity_rad_s: 10.0
    wheel_effort_nm: 20000.0
    wheel_power_limit_w: 160000.0
    wheel_power_reference_rad_s: 1.0
    # Numerical, uncalibrated floor that protects braking/contact transients
    # when the previous measured and current target speeds are both near zero.
    wheel_power_min_guard_rad_s: 10.0
    # Conservative multiplier for one 60 Hz interval between measured-speed
    # reads. Runtime still validates the post-step envelope every frame.
    wheel_power_discrete_safety_factor: 1.15
    steering:
      lower_deg: -35.0
      upper_deg: 35.0
      velocity_deg_s: 18.0
      effort_nm: 1500000.0
    lift:
      lower_deg: -10.0
      upper_deg: 48.0
      velocity_deg_s: 12.0
      effort_nm: 2500000.0
    bucket_curl:
      lower_deg: -40.0
      upper_deg: 60.0
      velocity_deg_s: 18.0
      effort_nm: 1500000.0

command_slew:
  provenance: ASSUMED
  throttle_per_s: 1.5
  steering_per_s: 1.8
  lift_per_s: 1.25
  bucket_curl_per_s: 1.5

keyboard:
  provenance: INTERFACE_CONTRACT
  throttle_forward: W
  throttle_reverse: S
  steering_left: A
  steering_right: D
  lift_up: I
  lift_down: K
  bucket_curl: J
  bucket_dump_pose: L
  brake: SPACE
  reset_commands: R
  stop_controller: ESCAPE

safety:
  normal_loop_pose_setter_allowed: false
  root_pose_write_allowed_during_initialization: true
  root_pose_write_allowed_during_reset: true
  emergency_recovery_requires_debug_flag: true
